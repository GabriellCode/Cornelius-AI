plugins {
    id 'java'
    id 'application'
}

group = 'com.cornelius'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Zero dependencias externas - Utiliza bibliotecas nativas do Java 21 LTS
}

application {
    mainClass = 'com.cornelius.Main'
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'cornelius.jar'
    manifest {
        attributes(
            'Main-Class': 'com.cornelius.Main',
            'Implementation-Title': 'Cornelius AI',
            'Implementation-Version': project.version
        )
    }
}

